[custom]
; Cloudflare + FlClash 手机电信5G精简模板 v2
; 基于现有 ruleLite.ini 精简：
; 1) 不设“网络媒体”组，YouTube 已由 ProxyLite.list 代理
; 2) 不使用 GlobalMedia.list，避免国内/国外媒体混合导致策略冲突
; 3) 删除手机不需要的“游戏平台”组
; 4) 漏网之鱼默认走代理兜底

; 规则集定义
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Game_Download_CDN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/jijg1022/rule/refs/heads/main/DirectLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list
ruleset=🤖 AI,https://raw.githubusercontent.com/jijg1022/rule/refs/heads/main/AI.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/jijg1022/rule/refs/heads/main/ProxyLite.list
ruleset=🎯 全球直连,[]GEOSITE,category-games-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🚀 节点选择,[]GEOSITE,gfw
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; 策略组定义
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🛩️ 手动选择`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`^((?!((?i)Premium|Expire|Traffic|500)).)*$`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🛩️ 手动选择`select`^((?!((?i)Premium|Expire|Traffic|500)).)*$
custom_proxy_group=🤖 AI`select`[]🚀 节点选择`[]♻️ 自动选择`[]🛩️ 手动选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]🛩️ 手动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🛩️ 手动选择`[]DIRECT

; 启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true
